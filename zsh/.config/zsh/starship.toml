"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$rust\
$lua\
$python\
$ruby\
$golang\
$nodejs\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character
"""

add_newline = false
# palette = 'everforest_light'

[fill]
symbol = '·'
style = 'bold black'

[os]
format = '[ $symbol ]($style)'
style = 'bold cyan'
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
NixOS = " "
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'bold purple'
format = 'on [$symbol$branch(:$remote_branch)]($style) '
symbol = ' '

[cmd_duration]
style = 'gray'
format = '[$duration]($style)'

[rust]
symbol = ' '
format = '[$symbol($version )]($style)'

[lua]
symbol = ' '
format = '[$symbol($version )]($style)'

[python]
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
style = 'blue'
symbol = ' '

[nodejs]
symbol = ' '
format = '[$symbol($version )]($style)'

[jobs]
symbol = ''
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'


